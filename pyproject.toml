[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caldera-sauna"
version = "0.1.0"
description = "Local BLE control library for Relaxe Caldera infrared saunas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "bleak>=0.22",
    "bleak-retry-connector>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "python-dotenv>=1.0"]

[project.scripts]
caldera-sauna-monitor = "caldera_sauna.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
