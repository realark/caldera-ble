[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "caldera-sauna"
version = "0.0.5"
description = "Local Bluetooth LE control library for Relaxe Caldera infrared saunas"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "Ark" }]
keywords = ["bluetooth", "ble", "sauna", "caldera", "relaxe", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "bleak>=0.22",
    "bleak-retry-connector>=3.5",
]

[project.urls]
Homepage = "https://github.com/realark/caldera-ble"
Repository = "https://github.com/realark/caldera-ble"
Issues = "https://github.com/realark/caldera-ble/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "python-dotenv>=1.0"]
# Home Assistant integration tests (tests_ha/). Needs Python <= 3.12 for now,
# since the pinned HA release tracks the last one supporting it.
ha-test = ["pytest-homeassistant-custom-component"]

[project.scripts]
caldera-sauna-monitor = "caldera_sauna.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# HA integration tests live in tests_ha/ (require the ha-test extra) and are run
# explicitly, out of the default testpaths:
#   pip install -e ".[ha-test]" && pytest tests_ha/ -o asyncio_mode=auto

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
